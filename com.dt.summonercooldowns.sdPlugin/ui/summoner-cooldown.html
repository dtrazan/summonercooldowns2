<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Summoner Spell Settings</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Summoner Spell">
        <sdpi-select setting="current_summoner_spell">
            <option value="SummonerBarrier">Barrier</option>
            <option value="SummonerClarity">Clarity</option>
            <option value="SummonerCleanse">Cleanse</option>
            <option value="SummonerExhaust">Exhaust</option>
            <option value="SummonerFlash">Flash</option>
            <option value="SummonerGhost">Ghost</option>
            <option value="SummonerHeal">Heal</option>
            <option value="SummonerIgnite">Ignite</option>
            <option value="SummonerSmite">Smite</option>
            <option value="SummonerTeleport">Teleport</option>
            <option value="SummonerUnleashedTeleport">Unleashed Teleport</option>
        </sdpi-select>
    </sdpi-item>
</body>
</html>
